defaults:
  # Documents that do not explicitly declare canonical_status are treated as
  # draft maturity. This avoids implicitly claiming approval for legacy nodes
  # before they are backfilled and reviewed.
  canonical_status: draft

field_definitions:
  owner: >-
    Accountable organizational role for the document content, its accuracy
    and its review. Not a system and not a repository.
  owners: >-
    Optional informative list of all roles sharing responsibility for the
    document. The required owner field names the leading (accountable) role
    and should be one of this list when the list is present.
  system_owner: >-
    Systems or repositories (from the system_owner enum) that own the
    subject matter of the document. Not people and not roles.

conditional_rules:
  domain_context:
    when_knowledge_area:
      - product
      - ai-system
      - domain-model
      - architecture
      - safety-governance
      - design
      - business
    require:
      - domain
    non_empty: true
  mirror:
    when:
      source_kind: mirror
    require:
      - source_repository
      - source_path
      - source_ref
      - synced
      - source_content_hash
    forbid_manual_edit: true
  restricted:
    when:
      classification: restricted
    allowed_ai_indexing:
      - denied
      - metadata-only
    allowed_export_policy:
      - metadata-only
      - prohibited
  confidential:
    when:
      classification: confidential
    allowed_export_policy:
      - sanitized
      - metadata-only
      - prohibited
  # Documents the standing convention for internal documents: every export
  # policy value is admissible, so this rule carries no restriction and is
  # not enforced by the validator. It replaces the rejected dialect value
  # export_policy: internal-only (see AYLA-DEC-0013).
  internal:
    when:
      classification: internal
    allowed_export_policy:
      - full
      - sanitized
      - metadata-only
      - prohibited
  denied_ai_index:
    when:
      ai_indexing: denied
    allowed_export_policy:
      - metadata-only
      - prohibited
  p0_p1:
    when_priority:
      - P0
      - P1
    require:
      - owner
      - review_cycle
      - depends_on
  provisional_system_owner:
    when_system_owner_contains:
      - to-be-confirmed
    allowed_status:
      - idea
      - draft
      - review
      - planned
    forbidden_status:
      - approved
      - approved-with-amendments
      - implemented
      - delivered
    allowed_until: 2026-08-15

field_constraints:
  node_id:
    format: "^[a-z0-9]+(?:[.-][a-z0-9]+)*$"
    immutable: true
    unique: false
  system_owner:
    type: list
    min_items: 1
    unique_items: true
    items_from_enum: system_owner
  source_repository:
    optional: true
    value_from_enum: source_repository
  data_categories:
    optional: true
    require_when_data_sensitivity:
      - low
      - medium
      - high
      - critical
  owners:
    optional: true
    type: list
    unique_items: true
    # informative only: validator warns when owner is not an element
    warn_unless_contains_field: owner

uniqueness_rules:
  # Variant C: a Knowledge Node is a logical entity identified by node_id.
  # Multiple revisions may coexist. Uniqueness is enforced only among
  # Active Canon revisions (one active canonical revision per node).
  node_id:
    source_kind: canonical
    active_statuses:
      - approved
      - approved-with-amendments
      - implemented
      - delivered
    excluded_statuses:
      - archived
      - superseded
      - deprecated
      - cancelled
  title:
    source_kind: canonical
    active_statuses:
      - approved
      - approved-with-amendments
      - implemented
      - delivered
    excluded_statuses:
      - archived
      - superseded
      - deprecated
      - cancelled

lifecycle_transitions:
  idea: [draft, cancelled]
  draft: [review, cancelled]
  review: [draft, approved-with-amendments, approved, cancelled]
  approved-with-amendments: [approved, implemented, superseded, deprecated]
  approved: [implemented, superseded, deprecated]
  implemented: [superseded, deprecated]
  planned: [scheduled, cancelled]
  scheduled: [in-progress, blocked, cancelled]
  in-progress: [blocked, delivered, cancelled]
  blocked: [scheduled, in-progress, cancelled]
  delivered: [deprecated, superseded]
  deprecated: [archived]
  superseded: [archived]
  archived: []

document_type_rules:
  standard:
    normative: true
  map:
    normative: false
  research:
    normative: false
  knowledge-architecture-specification:
    normative: true
    require_sections:
      - Назначение и нормативность
      - Модель источников истины
      - Модель версионности
      - Ревью и управление изменениями
      - Валидация
      - Миграция из backend
      - Definition of Done
      - Change Log
  constitution:
    normative: true
    require_sections:
      - Преамбула
      - Термины
      - Статья I. Миссия и предметная область Ayla
      - Статья IV. Экономическая нейтральность
      - Статья XII. Границы компетенции, безопасность и соразмерность
      - Статья XIV. Автономия, согласия и приватность
      - Управление Конституцией
      - Заключительное положение
  foundation:
    normative: true
  product-thesis:
    normative: true
  specification:
    normative: true
  ai-specification:
    normative: true
    require_sections:
      - Responsibility
      - Inputs
      - Outputs
      - Owns
      - Does not own
  safety-specification:
    normative: true
  architecture-specification:
    normative: true
  adr:
    normative: true
    require:
      - adr_id
      - decision_status
      - revision
      - amendments
      - superseded_by
  decision-log:
    normative: true
    require_sections:
      - Назначение
      - Реестр решений
      - Change Log
  moc:
    normative: false
  glossary:
    normative: false
  terminology-standard:
    normative: true
    require_sections:
      - Purpose and authority
      - Правила использования
      - Key term authority matrix
      - Change process
      - Definition of Done
      - Change Log
  metadata-registry:
    normative: true
    generated_from: .knowledge/schema.yaml
    require_sections:
      - Purpose and authority
      - Source of truth
      - Required metadata fields
      - Controlled vocabularies
      - Lifecycle transitions
      - Document types
      - Relationship semantics
      - Ownership model
      - Conditional and safety rules
      - Update procedure
      - Definition of Done
      - Change Log
  user-journey-specification:
    normative: true
    require_sections:
      - Purpose
      - Journey Operating Model
      - Journey Overview
      - Stage Specifications
      - Memory Interaction
      - Recommendation and Proactivity Gates
      - Cross-channel Experience
      - Business Alignment
      - Metrics
      - Constitutional Traceability
      - Change Log
  domain-context-map:
    normative: true
    require_sections:
      - Document Status and Purpose
      - Scope and Source Documents
      - Context Mapping Method
      - Domain Classification — Commentary
  domain-specification:
    normative: true
    # require_sections intentionally deferred: the Core Domain Model
    # Specification is an honest empty draft per AYLA-DEC-0013; sections
    # are added together with the document template.
  data-inventory-matrix:
    normative: true
    require_sections:
      - Purpose
      - Matrix
      - Definitions
      - Critical Boundaries
      - Change Log
  dashboard:
    normative: false
  source-placeholder:
    normative: false

relationships:
  depends_on:
    directed: true
    acyclic: true
    target_must_exist: true
  supersedes:
    directed: true
    acyclic: true
    target_must_exist: true
  implements:
    directed: true
    acyclic: false
    target_must_exist: true
    allowed_target_capability: normative
  adr:
    directed: true
    acyclic: false
    target_must_exist: true
    allowed_target_types:
      - adr
  related:
    directed: false
    acyclic: false
    target_must_exist: true
  conflicts_with:
    directed: false
    acyclic: false
    target_must_exist: true
    require_companion_field: conflict_resolution

ai_export:
  default: deny
  require_explicit_allow: true
  prohibited_content:
    - real-user-pii
    - real-health-data
    - raw-user-messages
    - production-dumps
    - credentials
    - encryption-material

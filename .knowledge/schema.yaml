    - ayla-ai-core
    - ayla-conversation
    - ayla-user-context
    - ayla-recommendation
    - ayla-booking
    - ayla-provider-platform
    - ayla-mobile
    - ayla-mini-app
    - ayla-knowledge
    - shared
    - external
    - to-be-confirmed
  source_repository:
    - beautygo_backend
    - ai-bot-platform
    - ayla-knowledge
    - ayla-ai-core
    - external
  term_maturity:

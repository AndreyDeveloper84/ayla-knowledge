schema_version: "1.13"
specification: "../00 Foundation/Ayla Knowledge Architecture Specification.md"

schema_changes:
  "1.14":
    - "register document types `standard`, `map`, `research` (non-canonical research layer)"
    - "add `engineering-process` to the concerns vocabulary"
  "1.13":
    - adopt Variant C Knowledge Node versioning: node_id/title uniqueness is enforced only among Active Canon revisions
    - replace global node_id uniqueness with Active Canon scoped uniqueness
  "1.12":
    - register domain-context-map, domain-specification and data-inventory-matrix document types
    - define owner vs system_owner semantics; allow optional informative owners array
    - document classification x export_policy matrix for internal documents
  "1.11":
    - introduce canonical_status to separate source kind from canonical maturity
    - add product-requirements source_kind value
  "1.10":
    - distinguish user-initiated recommendation and proactive readiness gates
  "1.9":
    - register user-journey-specification with required normative sections
  "1.8":
    - register schema-generated metadata-registry document type
  "1.7":
    - require core normative sections for terminology-standard documents
  "1.6":
    - register decision-log document type with required normative sections
    - validator rejects document types missing from document_type_rules
  "1.5":
    - require core normative sections for constitution documents
  "1.4":
    - establish stable filenames and node IDs
    - add staged-migration validation profile

versioning:
  canonical_filename:
    stable: true
    prohibit_semantic_version_suffix: true
  node_id:
    stable: true
    prohibit_semantic_version_suffix: true
  revision_history:
    source: git
  semantic_version_field: version

validation_profiles:
  default:
    applies_to: all-active-knowledge-nodes
  staged_migration:
    when:
      status: review
      activation_status: pending-infrastructure
    missing_relationship_targets: warning

required_fields:
  - node_id
  - title
  - type
  - status
  - version
  - owner
  - knowledge_area
  - system_owner
  - source_kind
  - classification
  - data_sensitivity
  - security_sensitivity
  - ai_indexing
  - export_policy
  - updated
  - review_cycle

enums:
  status:
    - idea
    - draft
    - review
    - approved
    - approved-with-amendments
    - implemented
    - planned
    - scheduled
    - in-progress
    - blocked
    - delivered
    - cancelled
    - deprecated
    - superseded
    - archived
  activation_status:
    - pending-infrastructure
    - active
    - suspended
  source_kind:
    - canonical
    - mirror
    - external
    - product-requirements
  canonical_status:
    - draft
    - candidate
    - approved
    - deprecated
  knowledge_area:
    - foundation
    - product
    - strategy
    - ai-system
    - domain-model
    - architecture
    - safety-governance
    - design
    - business
    - research
    - operations
    - sources
  system_owner:
